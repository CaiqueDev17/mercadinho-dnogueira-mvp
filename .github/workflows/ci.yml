name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar dependências com falha conhecida
        run: npm audit --audit-level=high

      - name: Rodar os testes com cobertura
        run: npx ng test --watch=false --coverage

      - name: Gerar o build de produção
        run: npx ng build

      - name: Guardar o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage
          if-no-files-found: ignore
